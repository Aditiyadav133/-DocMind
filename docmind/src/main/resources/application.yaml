spring:
  application:
    name: docmind
  servlet:
    multipart:
      max-file-size: 24MB
      max-request-size: 50MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/docmind}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  ai:
    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        chat:
          model: gemini-3.6-flash
          temperature: 0.2
        embedding:
          api-key: ${GOOGLE_API_KEY}
          text:
            model: gemini-embedding-001
            dimensions: 1536
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        table-name: vector_store
app:
  rag:
    chunk-size: 700
    chunk-overlap: 100
    top-k: 5
    similarity-threshold: 0.0
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:3000}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
jwt:
  secret: ${JWT_SECRET}
  expiration: 360000000
server:
    port: ${PORT:8081}
logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG